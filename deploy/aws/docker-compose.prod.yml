# Production on AWS EC2 (ap-southeast-1). See docs/DEPLOYMENT.md §2.2–2.3 and terraform/.
# /opt/hbe/.env is rendered from SSM Parameter Store at boot by the instance's user data
# (template: config/env/production-aws.env.example). Same image as the Render demo; only
# ROLES and the env differ.
#
# Which services run on a host is chosen with COMPOSE_PROFILES:
#   stage A (one host):          app,worker,tls   (Caddy terminates TLS)
#   stage B, web+api hosts:      app              (the ALB terminates TLS, ports 3000/4000)
#   stage B, worker host:        worker
name: hbe

x-app: &app
  image: ${HBE_IMAGE:?set HBE_IMAGE in .env}
  env_file: .env
  restart: unless-stopped
  stop_grace_period: 30s
  logging:
    driver: awslogs
    options:
      awslogs-region: ${AWS_REGION:-ap-southeast-1}
      awslogs-group: ${HBE_LOG_GROUP:-/hbe/prod/app}
      awslogs-create-group: "true"
  healthcheck:
    test:
      [
        "CMD",
        "node",
        "-e",
        "fetch('http://localhost:'+(process.env.PORT||3000)+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
      ]
    interval: 15s
    timeout: 5s
    retries: 4

services:
  web:
    <<: *app
    profiles: [app]
    # Server-side calls from the web app go straight to the api container.
    environment: { ROLES: web, PORT: "3000", INTERNAL_API_URL: "http://api:4000" }
    # The ALB's target (stage B); stage A's security group keeps it closed.
    ports: ["3000:3000"]

  api:
    <<: *app
    profiles: [app]
    environment: { ROLES: api, PORT: "4000" }
    ports: ["4000:4000"]

  worker:
    <<: *app
    profiles: [worker]
    # The worker serves /healthz only on the internal network.
    environment: { ROLES: worker, PORT: "4100" }

  caddy:
    image: caddy:2.8.4-alpine
    profiles: [tls]
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [web, api]

volumes:
  caddy_data:
