# Weekly dependency updates. New versions wait 14 days before being proposed, the same rule
# the project follows when adding dependencies by hand; security updates are not delayed.
version: 2
updates:
  - package-ecosystem: npm # pnpm workspace (pnpm-lock.yaml)
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
