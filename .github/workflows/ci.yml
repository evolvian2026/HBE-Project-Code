name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - name: Validate config templates parse
        run: pnpm --filter @hbe/settings test

  integration:
    name: Database, integration and end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 40 # the first browser-test run builds the Playwright tester image
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Start local Supabase (Postgres, Auth, REST, Storage, Mailpit)
        run: pnpm db:start

      - name: Database tests (pgTAP) and schema lint
        run: |
          pnpm db:test
          pnpm db:lint

      - name: Integration tests (db, queue, server)
        run: |
          # Local Storage's S3 API stands in for the external archive bucket.
          eval "$(pnpm -s exec supabase status -o env | sed 's/^/export SB_/')"
          export SUPABASE_S3_ACCESS_KEY_ID="$SB_S3_PROTOCOL_ACCESS_KEY_ID"
          export SUPABASE_S3_SECRET_ACCESS_KEY="$SB_S3_PROTOCOL_ACCESS_KEY_SECRET"
          pnpm test:integration

      - name: Build web and server
        run: pnpm build

      - name: Start the app (single process, all roles)
        run: |
          eval "$(pnpm -s exec supabase status -o env | sed 's/^/export SB_/')"
          cat > "$RUNNER_TEMP/app.env" <<ENV
          NODE_ENV=production
          HBE_ENV=local
          HBE_PLAN_PROFILE=free
          ROLES=web,api,worker
          PORT=3000
          APP_URL=http://localhost:3000
          API_URL=http://localhost:3000
          SUPABASE_URL=${SB_API_URL}
          SUPABASE_PUBLISHABLE_KEY=${SB_PUBLISHABLE_KEY}
          SUPABASE_SECRET_KEY=${SB_SECRET_KEY}
          DATABASE_URL=${SB_DB_URL}
          QUEUE_DATABASE_URL=${SB_DB_URL}
          GITHUB_APP_ID=1
          GITHUB_APP_PRIVATE_KEY_BASE64=eA==
          GITHUB_APP_SLUG=hbe-ci
          GITHUB_FAKE=true
          GITHUB_FAKE_GIT_ROOT=${RUNNER_TEMP}/fake-github
          GITHUB_WEBHOOK_SECRET=ci-secret
          GRADER_REPO=hbe-ci/hbe-grader
          GRADER_CALLBACK_AUTH=token
          EMAIL_PROVIDER=smtp
          SMTP_URL=smtp://127.0.0.1:54325
          EMAIL_FROM=HBE CI <ci@localhost>
          TOKEN_ENCRYPTION_KEY=ci
          # The end-to-end tests run a stand-in Google on this port (packages/lms/src/google-testing.ts).
          GOOGLE_OAUTH_CLIENT_ID=fake-google-client
          GOOGLE_OAUTH_CLIENT_SECRET=fake-google-secret
          GOOGLE_FAKE_URL=http://127.0.0.1:54390
          ENV
          cd apps/server
          nohup node --env-file="$RUNNER_TEMP/app.env" dist/main.js > "$RUNNER_TEMP/app.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/healthz && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/app.log"; exit 1

      - name: Install Playwright browser
        run: pnpm --filter @hbe/e2e exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e
        env:
          E2E_WEBHOOK_SECRET: ci-secret
          E2E_FAKE_GIT_ROOT: ${{ runner.temp }}/fake-github

      - name: Upload Playwright report and app log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
            ${{ runner.temp }}/app.log
          retention-days: 7

  grader:
    name: Grader harness (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Grade the fixture apps with the real harness
        run: node --test --test-concurrency=1 grader/test/harness.docker.test.mjs

  templates:
    name: Starter templates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Grade every starter template with the real harness
        run: node --test --test-concurrency=1 grader/test/templates.docker.test.mjs

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: hbe-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
